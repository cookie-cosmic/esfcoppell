services:
  - type: web
    name: esfcoppell-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run serve
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /var/data/endless-smiles
      - key: PERSISTENCE_REQUIRED
        value: "true"
      - key: CLIENT_ORIGIN
        value: https://esfcoppell.web.app
      - key: MEMBER_COOKIE_SECRET
        generateValue: true
      - key: SUPABASE_DB_URL
        sync: false
      - key: GOOGLE_SHEETS_WEBHOOK_URL
        value: https://script.google.com/a/macros/g.coppellisd.com/s/AKfycbzuio_DBPMm8PxlXbKqwQ9LTkTMU_kvFZg9NhBWKPl6YT_-iYoLcoij8OWMX29Bn18B4w/exec
      - key: GOOGLE_SHEETS_TAB
        value: Submissions
    disk:
      name: endless-smiles-data
      mountPath: /var/data
      sizeGB: 1
