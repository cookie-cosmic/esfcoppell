services:
  - type: web
    name: esfcoppell-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run serve
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /var/data/endless-smiles
      - key: CLIENT_ORIGIN
        value: https://esfcoppell.web.app
      - key: MEMBER_COOKIE_SECRET
        generateValue: true
    disk:
      name: endless-smiles-data
      mountPath: /var/data
      sizeGB: 1
